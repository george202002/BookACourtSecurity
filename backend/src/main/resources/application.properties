spring.application.name=bookacourt

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:bookacourt}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update

app.cors.allowed-origins=${CORS_ALLOWED_URL:http://localhost:5173}
frontend.url=${FRONTEND_URL:http://localhost:5173}

#email (local dev mail server, e.g. Mailpit - SMTP on localhost:1025, web UI on http://localhost:8025)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.from=noreply@bookacourt.local

#stripe
stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}

#Firebase (service account JSON; defaults to firebase-service-account.json in resources,
#override with FIREBASE_SERVICE_ACCOUNT=file:C:/path/to/serviceAccountKey.json)
firebase.service.account=${FIREBASE_SERVICE_ACCOUNT:classpath:firebase-service-account.json}
