<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Επιβεβαίωση Εγγραφής</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333333; }
        .email-container { max-width: 600px; margin: auto; background: #fff; border: 1px solid #4880ff; border-radius: 5px; }
        .email-header { background: #4880ff; color: #fff; text-align: center; padding: 20px; }
        .email-body { padding: 20px; }
        .email-footer { background: #f1f1f1; color: #777; text-align: center; padding: 10px; }
        .button { display: inline-block; margin: 20px 0; padding: 10px 20px; background: #4880ff; color: #ffffff !important; text-decoration: none; border-radius: 5px; }
        .button:hover { background: #3a68cc; }
    </style>
</head>
<body>
<div class="email-container">
    <div class="email-header">
        <h1>Επιβεβαίωση Εγγραφής</h1>
    </div>
    <div class="email-body">
        <p>Αγαπητέ/ή {{firstName}},</p>
        <p>Σας ευχαριστούμε που εγγραφήκατε στην πλατφόρμα μας!</p>
        <p>Ξεκινήστε να κλείνετε τα γήπεδα σας τώρα!</p>
        <a href="{{frontendUrl}}" class="button">Σύνδεση</a>
    </div>
    <div class="email-footer">
        <p>&copy; 2025 BookACourt</p>
        <a href="{{frontendUrl}}" target="_blank">
            <img class="logo" src="{{frontendUrl}}/logo.png" alt="BookACourt Logo" />
        </a>
    </div>
</div>
</body>
</html>
